name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # MongoDB runs natively from the official tarball (no Docker). Single-node replica set
  # so transactions and change-stream-style behaviour match Atlas.
  MONGODB_VERSION: "8.0.23"
  MONGODB_DIST: "ubuntu2404"
  TEST_MONGODB_URI: "mongodb://127.0.0.1:27017/?replicaSet=rs0"
  E2E_MONGODB_URI: "mongodb://127.0.0.1:27017/?replicaSet=rs0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Start MongoDB replica set
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL "https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-${MONGODB_DIST}-${MONGODB_VERSION}.tgz" | tar -xz
          mkdir -p db
          ./mongodb-linux-*/bin/mongod --replSet rs0 --bind_ip 127.0.0.1 --dbpath db --fork --logpath mongod.log
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Initiate replica set
        run: |
          python - <<'EOF'
          import time
          from pymongo import MongoClient
          c = MongoClient("mongodb://127.0.0.1:27017/?directConnection=true")
          c.admin.command("replSetInitiate", {"_id": "rs0", "members": [{"_id": 0, "host": "127.0.0.1:27017"}]})
          for _ in range(60):
              if c.admin.command("hello").get("isWritablePrimary"):
                  break
              time.sleep(1)
          else:
              raise SystemExit("replica set did not elect a primary")
          EOF
      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check (mypy)
        run: python -m mypy app
      - name: Tests (pytest)
        run: python -m pytest -q
      - name: Dependency audit (pip-audit)
        run: python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (npm)
        run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start MongoDB replica set
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL "https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-${MONGODB_DIST}-${MONGODB_VERSION}.tgz" | tar -xz
          mkdir -p db
          ./mongodb-linux-*/bin/mongod --replSet rs0 --bind_ip 127.0.0.1 --dbpath db --fork --logpath mongod.log
      - name: Backend virtualenv (the E2E config expects backend/.venv)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python - <<'EOF'
          import time
          from pymongo import MongoClient
          c = MongoClient("mongodb://127.0.0.1:27017/?directConnection=true")
          c.admin.command("replSetInitiate", {"_id": "rs0", "members": [{"_id": 0, "host": "127.0.0.1:27017"}]})
          for _ in range(60):
              if c.admin.command("hello").get("isWritablePrimary"):
                  break
              time.sleep(1)
          else:
              raise SystemExit("replica set did not elect a primary")
          EOF
      - name: Frontend packages and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
